name: Matrix include
on: [push]
jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.node }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
        include:
          - os: ubuntu-latest
            node: 24
        exclude:
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo ok
  notify:
    name: Notify the team
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
