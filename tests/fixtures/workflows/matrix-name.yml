name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: namespace-profile-default
          - name: macOS
            os: macos-15
        run-all:
          - true
          - false
        exclude:
          - run-all: false
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 30
    name: ${{ matrix.runner.name }}
    steps:
      - run: echo ok
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
