name: Rust CI
on: pull_request
jobs:
  calculate_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - run: echo ok
  job:
    needs: calculate_matrix
    strategy:
      matrix: ${{ fromJSON(needs.calculate_matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    steps:
      - run: echo ok
